        const densityStorageKey = '__APP__UI_DENSITY__'
        const densityScales = {

          compact: 0.8,
          dense: 2 / 3
        }
        let currentDensityScale = 0

        const isNamedDensity = (density) =>
          Object.prototype.hasOwnProperty.call(densityScales, density)

        const getAutoDensityScale = () => {
          const currentDpr = window.devicePixelRatio || 1
          const viewportCssWidth = window.innerWidth
